# Publishes the docs of nerDDocs, in docs/, as a site on GitHub Pages on each push to master.
name: Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time. A newer push waits for the publish before it, which runs to its end.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node dist/nerddocs.cjs check docs
      - run: node dist/nerddocs.cjs export docs --out _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
